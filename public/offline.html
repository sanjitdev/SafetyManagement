<!doctype html>
<html lang="bn">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CityFix — অফলাইন</title>
    <style>
      :root {
        color-scheme: light dark;
        --ink: #101828;
        --ink-secondary: #475467;
        --surface: #ffffff;
        --page: #f7f8fa;
        --border: #e4e7ec;
        --primary: #1a56db;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #f5f5f6;
          --ink-secondary: #a5a5b3;
          --surface: #1c1c1e;
          --page: #101012;
          --border: #2e2e33;
          --primary: #7aa2f7;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--page);
        color: var(--ink);
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        padding: 2rem;
      }
      main {
        max-width: 26rem;
        width: 100%;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 1.75rem;
        box-shadow: 0 1px 2px rgb(16 24 40 / 6%);
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.25rem;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0 0 1rem;
        color: var(--ink-secondary);
        font-size: 0.9375rem;
        line-height: 1.6;
      }
      a {
        display: inline-block;
        padding: 0.625rem 1rem;
        background: var(--primary);
        color: #fff;
        border-radius: 8px;
        font-size: 0.9375rem;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 lang="bn">অফলাইন — সংযোগ পুনরায় স্থাপন করুন</h1>
      <p lang="bn">
        আপনি এখন ইন্টারনেটের বাইরে আছেন। আগের কাজগুলো সেভ করা আছে এবং
        সংযোগ ফিরে এলে সেগুলো স্বয়ংক্রিয়ভাবে পাঠানো হবে।
      </p>
      <p lang="en">
        You are offline. Your queued changes are saved and will be sent
        automatically once the connection returns.
      </p>
      <a href="/crew" lang="bn">পুনরায় চেষ্টা করুন</a>
    </main>
  </body>
</html>
