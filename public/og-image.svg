<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="cityfix-og-title">
  <title id="cityfix-og-title">CityFix — report a civic issue and track it to resolution</title>
  <!--
    Social card for shared report links.

    The card is a flat civic-blue field with the mark, the wordmark and
    a bilingual tagline. It is deliberately flat — no gradients, no
    shadows — to match the Swiss/Minimal direction and to stay legible
    when the platform renders it at a small size in a feed.
  -->

  <rect width="1200" height="630" fill="#1E40AF" />

  <!--
    Mark: scaled 4x from the 24x24 grid and positioned on the left.

    The card is a civic-blue field, so the mark uses the DARK-THEME
    variants of its three colours: a light blue pin, the field's own
    blue for the carved eye, and the lighter service green for the
    check. That is the same inversion the app's dark theme uses, so the
    social card and the app stay one brand.
  -->
  <g transform="translate(120, 215) scale(4)">
    <path
      d="M12 22.4c-.4 0-.74-.21-.93-.57C10.65 20.7 6.2 15.2 6.2 10 6.2 5.6 8.9 2 12.2 2S18.2 5.6 18.2 10c0 5.2-4.45 10.7-4.87 11.83-.19.36-.53.57-.93.57Z"
      fill="#60A5FA"
    />
    <rect x="7.5" y="5.1" width="9" height="9" rx="2" fill="#1E40AF" />
    <path
      d="M9.6 9.5 11.3 11.2l3.4-3.6"
      fill="none"
      stroke="#4ADE80"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <!-- Wordmark. -->
  <text
    x="250"
    y="330"
    font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
    font-size="76"
    font-weight="700"
    letter-spacing="-1.8"
    fill="#FFFFFF"
  >CityFix</text>

  <!--
    Bilingual tagline. Bangla-first: the Bangla line is the headline and
    the English line supports it.
  -->
  <text
    x="250"
    y="392"
    font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
    font-size="34"
    font-weight="500"
    fill="#DBEAFE"
  >আপনার শহরের সমস্যা জানান, সমাধান দেখুন</text>
  <text
    x="250"
    y="444"
    font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
    font-size="26"
    font-weight="400"
    fill="#BFDBFE"
  >Report a city issue. Follow it to resolution.</text>

  <!-- Hairline rule + city attribution. -->
  <rect x="120" y="500" width="960" height="2" fill="#3B82F6" />
  <text
    x="120"
    y="548"
    font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
    font-size="24"
    font-weight="500"
    fill="#DBEAFE"
  >ঢাকা উত্তর সিটি কর্পোরেশন</text>
  <text
    x="120"
    y="582"
    font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
    font-size="19"
    font-weight="400"
    fill="#93C5FD"
  >Dhaka North City Corporation</text>
</svg>
