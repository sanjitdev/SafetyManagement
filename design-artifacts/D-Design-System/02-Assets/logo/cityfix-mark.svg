<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-labelledby="cityfix-mark-title">
  <title id="cityfix-mark-title">CityFix — a civic map pin whose carved square eye holds a check mark</title>

  <!--
    The mark is one idea, drawn once:
      the PIN  = a civic issue at a place
      the EYE  = the issue, looked at
      the CHECK = reported, and resolved

    The eye is CARVED OUT of the pin as negative space and it is
    SQUARE, not round. A round hole reads as a generic map pin; a square
    with a tight 2-unit corner radius reads as civic and Swiss, and it
    matches the radius language of the app's own cards and tiles. It is
    also the shape that stays crisp at 16px, which is where a favicon
    has to live.

    The check is drawn with a stroke so the negative space stays open
    around it — the eye reads as the pin's hole, not as a filled square.

    Colours are the design tokens: civic blue, the card surface for the
    carved eye, and service green for the check. The social card
    (og-image.svg) uses the dark-theme variants of the same three.
  -->

  <!-- Pin body — civic blue. -->
  <path
    d="M12 22.4c-.4 0-.74-.21-.93-.57C10.65 20.7 6.2 15.2 6.2 10 6.2 5.6 8.9 2 12.2 2S18.2 5.6 18.2 10c0 5.2-4.45 10.7-4.87 11.83-.19.36-.53.57-.93.57Z"
    fill="#1E40AF"
  />

  <!-- The carved eye. -->
  <rect x="7.5" y="5.1" width="9" height="9" rx="2" fill="#FFFFFF" />

  <!-- The check. -->
  <path
    d="M9.6 9.5 11.3 11.2l3.4-3.6"
    fill="none"
    stroke="#16A34A"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
