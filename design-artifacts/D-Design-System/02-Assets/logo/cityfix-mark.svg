<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-labelledby="cityfix-mark-title">
  <title id="cityfix-mark-title">CityFix — a map pin whose negative space forms a check mark</title>

  <!--
    The mark is one idea, drawn twice:
      the PIN  = a civic issue at a place
      the CHECK = reported, and resolved

    The pin body is a rounded teardrop. The check is NOT drawn on top of
    it — it is CARVED OUT of the pin as negative space, so the check reads
    as the pin's own hole. That is what makes it legible at 16px: a solid
    silhouette with a single punched-out tick, rather than two overlapping
    shapes that turn to mush.
  -->

  <!-- Pin body — navy. -->
  <path
    d="M12 22.5c-.42 0-.78-.22-.98-.6C10.6 20.9 6 15.3 6 9.9 6 5.4 9.13 1.8 12.95 1.8S20 5.4 20 9.9c0 5.4-4.6 11-5.02 12-.2.38-.56.6-.98.6Z"
    fill="#0F172A"
  />

  <!--
    Civic-blue accent: a thin arc on the pin's shoulder that reads as the
    civic/blue identity without adding a second silhouette.
  -->
  <path
    d="M7.1 6.6a6.1 6.1 0 0 1 3-2.35"
    fill="none"
    stroke="#1E40AF"
    stroke-width="1.7"
    stroke-linecap="round"
  />

  <!--
    The check, in service green, sitting in the pin's eye. It is drawn
    with a stroke so the negative space stays open around it — the pin's
    hole reads as the pin's hole, not as a filled circle.
  -->
  <path
    d="M8.9 9.6 11.3 12l4.1-4.4"
    fill="none"
    stroke="#16A34A"
    stroke-width="2.1"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
