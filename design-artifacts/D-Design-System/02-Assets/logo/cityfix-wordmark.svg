<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 152 32" width="152" height="32" role="img" aria-labelledby="cityfix-wordmark-title">
  <title id="cityfix-wordmark-title">CityFix</title>
  <!--
    Header lockup: mark + wordmark.

    The mark's paths are DUPLICATED inline rather than referenced from
    cityfix-mark.svg. An SVG that <use>s an external file does not render
    inside an <img> tag, and the header renders the wordmark as an image
    so it inherits the theme's colours and needs no JS.

    Geometry: the mark occupies the first 24 units, the wordmark starts
    at x=32, and the baseline sits at y=22 to match the mark's optical
    centre rather than its geometric one.
  -->

  <!-- Pin body — civic blue. -->
  <path
    d="M12 22.4c-.4 0-.74-.21-.93-.57C10.65 20.7 6.2 15.2 6.2 10 6.2 5.6 8.9 2 12.2 2S18.2 5.6 18.2 10c0 5.2-4.45 10.7-4.87 11.83-.19.36-.53.57-.93.57Z"
    fill="#1E40AF"
  />
  <!-- The carved eye. -->
  <rect x="7.5" y="5.1" width="9" height="9" rx="2" fill="#FFFFFF" />
  <!-- The check. -->
  <path
    d="M9.6 9.5 11.3 11.2l3.4-3.6"
    fill="none"
    stroke="#16A34A"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Wordmark. -->
  <text
    x="32"
    y="22"
    font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
    font-size="19"
    font-weight="700"
    letter-spacing="-0.45"
    fill="#0F172A"
  >CityFix</text>
</svg>
