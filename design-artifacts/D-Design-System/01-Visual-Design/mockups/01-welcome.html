<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome — CityFix</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../tokens.css">

  <style>
    body {
      font-family: var(--font-body);
      background: var(--color-surface-page);
      color: var(--color-ink);
      font-size: var(--text-body);
      line-height: var(--leading-normal);
      min-height: 100vh;
    }
    h1, h2 { font-family: var(--font-display); letter-spacing: var(--tracking-tight); font-weight: var(--weight-semibold); }

    /* Web layout — two-column hero. Single column at medium (≤1024px). */
    .page {
      min-height: 100vh;
      display: flex; align-items: stretch;
      max-width: var(--layout-desktop);
      margin: 0 auto;
    }
    .hero {
      flex: 1.1;
      display: flex; flex-direction: column;
      justify-content: space-between;
      padding: var(--space-8) var(--space-8) var(--space-7);
      min-height: 100vh;
    }
    .illustration {
      flex: 1;
      background: var(--color-surface-card);
      border-left: 1px solid var(--color-border);
      position: relative;
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      padding: var(--space-7);
    }
    /* Single column at medium */
    @media (max-width: 1024px) {
      .page { flex-direction: column; }
      .hero { padding: var(--space-7) var(--space-5) var(--space-6); min-height: auto; }
      .illustration { display: none; }
    }

    /* Wordmark */
    .wordmark {
      font-family: var(--font-display);
      font-weight: var(--weight-bold);
      font-size: 22px;
      letter-spacing: -0.02em;
      color: var(--color-ink);
      display: flex; align-items: center; gap: 10px;
    }
    .wordmark-dot {
      width: 10px; height: 10px;
      background: var(--color-primary);
      border-radius: 50%;
      display: inline-block;
    }

    /* Headline */
    .headline {
      font-size: var(--text-display-xl);
      line-height: 1.05;
      margin: 0 0 var(--space-4);
      letter-spacing: -0.025em;
    }
    .lede {
      font-size: var(--text-body-lg);
      color: var(--color-ink-secondary);
      line-height: 1.55;
      margin: 0;
      max-width: 480px;
    }

    /* CTAs */
    .btn-primary {
      display: flex; align-items: center; justify-content: center;
      height: var(--touch-cta);
      background: var(--color-primary);
      color: var(--color-on-primary);
      border: none; border-radius: var(--radius-sm);
      font-size: var(--text-body-lg);
      font-weight: var(--weight-semibold);
      cursor: pointer;
      width: 100%;
    }
    .btn-secondary {
      display: flex; align-items: center; justify-content: center;
      height: var(--touch-cta);
      background: transparent;
      color: var(--color-ink);
      border: 1px solid var(--color-border-strong);
      font-size: var(--text-body-lg);
      font-weight: var(--weight-semibold);
      cursor: pointer;
      border-radius: var(--radius-sm);
      width: 100%;
    }

    /* City illustration — abstract pin map */
    .city-art {
      width: 100%; height: 100%;
      max-width: 520px;
      aspect-ratio: 1 / 1;
      position: relative;
    }

    /* Trust strip */
    .trust {
      display: flex; align-items: center; gap: var(--space-3);
      flex-wrap: wrap;
      color: var(--color-ink-tertiary);
      font-size: var(--text-caption);
    }
    .trust-item {
      display: inline-flex; align-items: center; gap: 6px;
    }
  </style>
</head>
<body>

<div class="page">

  <!-- Left: brand + headline + CTAs -->
  <section class="hero">

    <!-- Top: brand -->
    <div class="wordmark">
      <span class="wordmark-dot"></span>
      CityFix
    </div>

    <!-- Middle: headline -->
    <div style="margin-top: var(--space-8);">
      <h1 class="headline">আপনার শহরের<br/>আওয়াজ।</h1>
      <p class="lede">
        ভাঙা রাস্তার আলো, ড্রেনে আটকে থাকা পানি, জমে থাকা আবর্জনা — রিপোর্ট করুন, অগ্রগতি দেখুন, সমাধানের প্রমাণ পান।
      </p>
    </div>

    <!-- Bottom: actions + trust -->
    <div style="margin-top: var(--space-8);">
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3); max-width: 520px;">
        <button class="btn-primary">নিবন্ধন করুন</button>
        <button class="btn-secondary">লগইন</button>
      </div>

      <div class="trust" style="margin-top: var(--space-5);">
        <span class="trust-item">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          সরকার পরিচালিত
        </span>
        <span class="trust-item">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          তথ্য সুরক্ষিত
        </span>
        <span class="trust-item">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
          বাংলা · English
        </span>
      </div>
    </div>

  </section>

  <!-- Right: illustration (hidden at medium) -->
  <aside class="illustration">
    <div class="city-art">
      <svg viewBox="0 0 520 520" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;">
        <!-- Background gradient -->
        <defs>
          <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="var(--color-surface-card)"/>
            <stop offset="100%" stop-color="var(--color-surface-page)"/>
          </linearGradient>
          <linearGradient id="road" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="var(--color-surface-raised)"/>
            <stop offset="100%" stop-color="var(--color-surface-sunken)"/>
          </linearGradient>
        </defs>

        <!-- Map background -->
        <rect width="520" height="520" fill="url(#bg)" rx="20"/>

        <!-- Roads -->
        <line x1="0" y1="180" x2="520" y2="160" stroke="url(#road)" stroke-width="36"/>
        <line x1="60" y1="0" x2="80" y2="520" stroke="url(#road)" stroke-width="32"/>
        <line x1="0" y1="380" x2="520" y2="370" stroke="url(#road)" stroke-width="24"/>
        <line x1="320" y1="0" x2="300" y2="520" stroke="url(#road)" stroke-width="22"/>

        <!-- Park -->
        <rect x="380" y="220" width="100" height="100" fill="var(--color-map-park)" rx="8"/>
        <!-- Water -->
        <rect x="20" y="430" width="160" height="60" fill="var(--color-map-water)" rx="8"/>

        <!-- Pins -->
        <!-- Pin 1 — open (red) -->
        <g transform="translate(110, 130)">
          <circle r="14" fill="var(--color-map-pin-open)" opacity="0.18"/>
          <circle r="9" fill="var(--color-map-pin-open)"/>
          <circle r="3.5" fill="white"/>
        </g>
        <!-- Pin 2 — in progress (amber) -->
        <g transform="translate(280, 250)">
          <circle r="14" fill="var(--color-map-pin-progress)" opacity="0.18"/>
          <circle r="9" fill="var(--color-map-pin-progress)"/>
          <circle r="3.5" fill="white"/>
        </g>
        <!-- Pin 3 — resolved (green) -->
        <g transform="translate(420, 110)">
          <circle r="14" fill="var(--color-map-pin-resolved)" opacity="0.18"/>
          <circle r="9" fill="var(--color-map-pin-resolved)"/>
          <circle r="3.5" fill="white"/>
        </g>
        <!-- Pin 4 — open (red) -->
        <g transform="translate(180, 400)">
          <circle r="14" fill="var(--color-map-pin-open)" opacity="0.18"/>
          <circle r="9" fill="var(--color-map-pin-open)"/>
          <circle r="3.5" fill="white"/>
        </g>
        <!-- Pin 5 — in progress -->
        <g transform="translate(440, 330)">
          <circle r="14" fill="var(--color-map-pin-progress)" opacity="0.18"/>
          <circle r="9" fill="var(--color-map-pin-progress)"/>
          <circle r="3.5" fill="white"/>
        </g>
      </svg>
    </div>
  </aside>

</div>

</body>
</html>
