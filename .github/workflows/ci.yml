name: CI

# The trunk branch is `prd-development` (team.md — "Way of Working").
# This workflow runs on every push and pull request so the 80% coverage
# floor (team.md — "Testing Posture") is enforced before merge.

on:
  push:
    branches: [prd-development, main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (lint, typecheck, unit, coverage, visual, build)
    runs-on: ubuntu-latest
    # 25 minutes was enough for lint + typecheck + unit + coverage +
    # the static mockup family + build. It is NOT enough now that the
    # route specs run in CI: the 333 route specs take ~11 minutes on
    # their own (they drive a live dev server, serially — `workers: 1`
    # in playwright.config.ts — and each one screenshots a full page).
    #
    # 45 minutes leaves room for the build step and the slowest spec
    # without turning a genuinely slow run into a hard timeout.
    timeout-minutes: 45

    env:
      # The unit suite and the mockup suite both run against the
      # in-memory dev store, so CI needs no Postgres. The dev store
      # is the same seam the local `npm run dev:feat` uses.
      CITYFIX_DEV_STORE: '1'
      # Placeholders only — never real credentials. The app's
      # production guards (e.g. the WebAuthn RP origin check in
      # lib/auth/webauthn.ts) read these at boot.
      DATABASE_URL: 'postgresql://cityfix:cityfix@localhost:5432/cityfix'
      SESSION_SECRET: 'ci-placeholder-session-secret-not-a-real-credential'
      WEBAUTHN_RP_ID: 'localhost'
      WEBAUTHN_RP_ORIGIN: 'http://localhost:3000'
      OTP_PROVIDER: 'stub'
      # A non-prod NODE_ENV so the production-only guards stay quiet in
      # the build step. `next build` sets its own NODE_ENV=production,
      # which is why the WebAuthn guard needs the https origin above.
      NEXT_TELEMETRY_DISABLED: '1'
      # The route-spec suite drives the REAL app against the in-memory
      # dev store, so it needs the same dev-store env vars the local
      # `npm run dev:feat` uses, plus the dev-only WebAuthn seam
      # (ADR-007 — the runner has no virtual authenticator).
      #
      # `CITYFIX_SEED_NOW` freezes the dev server's clock. Every
      # seeded timestamp is derived from it, so the rendered pages are
      # identical on every run and the committed visual baselines hold.
      # Without the pin, the route specs could never pass: the baseline
      # captured at 09:44 would be compared against a page rendered at
      # 14:22, and the timestamp column alone would fail the diff.
      # The value MUST match the one in
      # `.github/workflows/regenerate-baselines.yml`.
      #
      # `TZ=Asia/Dhaka` pins the process timezone to the product's
      # zone so the clock and the render agree.
      CITYFIX_SEED_NOW: '2026-11-06T09:44:00.000Z'
      TZ: 'Asia/Dhaka'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22 LTS — NOT 20.
          #
          # WHY: `jsdom@30` pulls `undici@8`, whose `engines.node` is
          # `>=22.19.0`. undici's decompress interceptor calls
          # `zlib.constants.ZSTD_d_windowLogMax`, which only exists from
          # Node 22.15 / 23.8 (Zstd support in `node:zlib`). On Node 20
          # that constant is `undefined`, so the module throws
          # `TypeError: Cannot read properties of undefined (reading 'bind')`
          # at import time — the whole Vitest suite dies with 16
          # unhandled errors and the Unit step fails.
          #
          # That failure was invisible locally: the dev machine runs
          # Node 24, where the constant is present and the suite is
          # green (101 files / 1835 tests). CI was red on every run
          # from 2026-10-29 until this bump, which also meant the
          # coverage floor and the visual-regression gate below were
          # being SKIPPED, because they run after the unit step.
          #
          # `engines.node` in package.json stays `>=20.0.0` because
          # that is the RUNTIME floor for the deployed app (Vercel
          # Node 20). The dev dependency on jsdom — and therefore
          # undici — is a TEST-time requirement only, and it is stricter
          # than the runtime floor. If the runtime floor is ever raised,
          # raise this pin in the same commit.
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test:unit

      - name: Coverage floor
        run: npm run test:unit:coverage

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Visual regression (mockup baselines)
        run: npm run test:mockups

      - name: Route specs
        # The per-WO route specs drive the REAL app through a live dev
        # server and assert the committed per-WO visual baselines.
        #
        # These were NOT running in CI before 2026-11-08 — the workflow
        # only exercised the static mockup family — so 333 route specs
        # (33 files) had never been executed by CI at all. That is how
        # 61 stale assertions and a broken native-binding path went
        # unnoticed. The step now runs them, and the env block above
        # supplies the dev-store, WebAuthn-seam and pinned-clock vars
        # they need.
        #
        # The mockup family is excluded because the step above already
        # ran it (`test:mockups`) — running it twice would double the
        # suite's wall time for no extra coverage.
        run: npx playwright test --grep-invert 'CityFix mockup baselines'

      - name: Build
        run: npm run build

      - name: Upload visual diff artifacts
        # Always upload, so a baseline failure can be diagnosed from the
        # diff PNG rather than guessed at from the error message. The
        # baselines are rendered by ubuntu-latest (see
        # tests-mockups/README.md), so CI's "actual" PNG is the reference
        # for what the mockups look like on the asserting platform.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mockup-diffs
          path: tests-mockups/artifacts/
          retention-days: 7
