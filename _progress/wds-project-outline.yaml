    WO-004: pending

scaffold:
  framework: nextjs-14-app-router
  status: live
  date: 2026-10-04
  entry-route: app/page.tsx     # placeholder; replaced by WO-001 1.6 Home / City Activity
  layout: app/layout.tsx        # root layout; Noto Sans Bengali; tokens.css imported
  dev-command: npm run dev      # http://localhost:3000
  build-command: npm run build
  smoke-test: GET / -> 200      # confirmed

tech-audit:
  status: complete
  date: 2026-10-04
  file: design-artifacts/E-Development/000-tech-audit.md
  lane: standalone-wds-v1.0.0
  brownfield-state: greenfield
  pinned-decisions:
    - framework: nextjs-14-app-router-typescript-strict-tailwind
    - map: maplibre-gl-js + openstreetmap (dev) / mapbox (prod-if-load-justifies)
    - push: web-push-api (v1); fcm-apns deferred
    - auth: http-only signed cookies; argon2 + simplewebauthn; four-role model; citizen otp; admin webauthn-mandatory
    - data: postgres-16 + prisma; r2/minio/s3 blobs
    - testing: extend existing playwright setup; per-WO route specs via compareMockupVsBuild
  deferred-to-prd:
    - otp-sms-provider  # stubbed in WO-000; chosen in WO-004
    - photo-retention-policy  # legal/privacy; WO-000 PRD
    - dedup-radius-default  # 50m recommendation; WO-000 PRD
    - hosting-target-specifics  # cloudflare vs vercel vs railway; WO-001 PRD
    - dispatcher-crew-scope-granularity  # (city, ward, department); WO-002 PRD

output-folder: design-artifacts

ux-design:
  total-pages: 33
  by-scenario:
    rahim-the-reporter: 14
    habib-the-handler: 7
    rashid-the-resolver: 5
    aamir-the-administrator: 7
  artifact-pattern: spec-as-contract
  wireframe-step: skipped-per-user
  # Page specs nest under each scenario folder in C-UX-Scenarios/, e.g.
  #   design-artifacts/C-UX-Scenarios/01-rahim-the-reporter/1.1-splash/1.1-splash.md
  spec-folder-pattern: design-artifacts/C-UX-Scenarios/<NN-scenario>/<N.M-page>/<N.M-page>.md

visual-design:
  format: html + tailwind-cdn + tokens.css
  mockups: 12
  components-library: 1
  tokens-file: tokens.css
  mockup-folder: design-artifacts/D-Design-System/01-Visual-Design/mockups
  visual-design-folder: design-artifacts/D-Design-System/01-Visual-Design
  brand-personality: apple-like-calm-confidence
  language: bangla-first
  brief-supplement: design-artifacts/A-Product-Brief/03-visual-direction.md
  # Web re-skin (2026-10-04): platform is web-first; Rashid's pages remain responsive.
  # UI redesign (2026-11-02, Intent 009): Accessible + Swiss/Minimal direction locked.
  viewports:
    large: 1440x900        # primary design target; per --layout-desktop
    medium: 1024x768       # collapse threshold; per --layout-tablet-max
    responsive-phone: 390x844  # Rashid-only (Feature #4); verified at this width
  # Coverage: 4 Rahim (01-04) at large+medium, 1 Habib (05) at large,
  # 2 Rashid (06-07) at large+medium+phone,
  # 5 auth/public (08-12) at large+medium.
  # Committed baselines = 4*2 + 1 + 2*3 + 5*2 = 25.
  baseline-count: 25
  baseline-folder: tests-mockups/baselines/01-mockups.spec.ts
  # Waves 3-6 add mockups 13-28 (citizen, dispatcher, crew, admin); final count 43.
  target-mockups: 28
  target-baselines: 43
  brand-assets: design-artifacts/D-Design-System/02-Assets/logo
  primitives-folder: components/ui
  charts-folder: components/ui/charts
  icon-registry: lib/ui/icon-map.ts

ui-redesign:
  intent: 009-ui-redesign
  opened: 2026-11-02
  direction: accessible-swiss-minimal
  waves:
    - 001-ci-unblock              # shipped 45062d1
    - 002-design-foundation       # shipped b279228
    - 003-auth-and-public-surfaces # mockups shipped; page impl pending approval
    - 004-citizen-surfaces        # not started
    - 005-dispatcher-console      # not started
    - 006-crew-field-app          # not started
    - 007-admin-console           # not started
    - 008-verification-and-signoff # not started
  gate: mockup-approval-before-each-implementation-wave

